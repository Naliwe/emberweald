product:
  type: kmp/lib
  platforms: [ jvm, wasmJs ]

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.ktor.client.core
  - $libs.ktor.client.contentNegotiation
  - $libs.ktor.serialization.kotlinxJson

settings:
  compose:
    enabled: true
    resources:
      packageName: net.hexacell.emberweald.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization:
      enabled: true

dependencies@jvm:
  - $libs.ktor.client.cio

dependencies@wasmJs:
  - $libs.ktor.client.js
