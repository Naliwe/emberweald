    serialization:
      enabled: true
  jvm:
    mainClass: net.hexacell.emberweald.server.ApplicationKt

test-dependencies:
  - $ktor.server.testHost
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json
